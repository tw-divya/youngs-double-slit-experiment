<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulation Lab</title><link rel="stylesheet" href="../css/style.css"></head><body data-root="../"><header id="nav"></header><main>
<h1>Simulation Laboratory</h1>
<div class="card"><h2>Experiment setup</h2><canvas id="setup" style="height:280px"></canvas></div>
<div class="grid two"><div class="card"><h2>Controls</h2>
<label>Wavelength λ <b><span id="lv"></span><span class="sw" id="sw"></span></b></label><input type="range" id="l" min="400" max="700" step="1" value="550">
<label>Slit separation d <b id="dv"></b></label><input type="range" id="d" min="0.10" max="0.80" step="0.01" value="0.30">
<label>Screen distance D <b id="Dv"></b></label><input type="range" id="D" min="0.5" max="3" step="0.1" value="1.5"><br>
<button class="btn" id="start">Start</button><button class="btn" id="pause">Pause</button><button class="btn" id="reset">Reset</button>
<button class="btn alt" id="defaults">Default values</button><button class="btn alt" id="random">Random experiment</button></div>
<div class="card"><h2>Observation screen</h2><canvas id="screen" style="height:130px"></canvas><div class="stats" id="stats"></div></div></div>
<div class="card"><h2>Intensity vs position</h2><canvas id="graph" style="height:300px"></canvas><div class="legend" id="legend"></div>
<button class="btn alt" id="save">Save current to compare</button><button class="btn alt" id="clear">Clear comparison</button></div>
<div class="card"><h2>Mathematical analysis</h2><div id="math"></div></div>
</main><footer id="footer"></footer><script src="../js/main.js"></script><script src="../js/physics.js"></script><script src="../js/simulation.js"></script></body></html>
